name: Update XPU kernel nightly test branch

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-xpu-kernel-nightly
  cancel-in-progress: false

jobs:
  update-test-branch:
    if: github.repository == 'wendyliu235/vllm-public'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_BRANCH: intel-kernel-nightly-test
    steps:
      - name: Require Buildkite token
        env:
          BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_TOKEN }}
        run: |
          test -n "$BUILDKITE_TOKEN" || {
            echo "Set BUILDKITE_TOKEN with write_builds permission" >&2
            exit 1
          }

      - name: Checkout fork default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild kernel nightly test branch and push
        id: update
        shell: bash
        run: |
          set -euo pipefail
          patch_file="$(mktemp "$RUNNER_TEMP/kernel-nightly.XXXXXX.patch")"
          trap 'rm -f "$patch_file"' EXIT
          cp .github/kernel-nightly/integration.patch "$patch_file"

          git remote add upstream https://github.com/vllm-project/vllm.git
          git fetch --no-tags upstream main
          git fetch --no-tags origin \
            "refs/heads/${TEST_BRANCH}:refs/remotes/origin/${TEST_BRANCH}"
          old_head="$(git rev-parse "origin/${TEST_BRANCH}")"
          echo "commit=$old_head" >> "$GITHUB_OUTPUT"
          upstream_head="$(git rev-parse upstream/main)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach "$upstream_head"
          git apply --3way --index "$patch_file"
          git diff --cached --check
          bash -n .buildkite/image_build/image_build_xpu.sh \
            .buildkite/scripts/hardware_ci/run-intel-test.sh

          if [[ "$(git write-tree)" == "$(git rev-parse "${old_head}^{tree}")" ]] &&
              git merge-base --is-ancestor "$upstream_head" "$old_head"; then
            echo "Upstream and kernel overlay are unchanged; no push needed"
            exit 0
          fi

          update_date="$(TZ=Asia/Shanghai date +%Y.%m.%d)"
          git commit -s \
            -m "${update_date} sync upstream for XPU kernel nightly" \
            -m "Upstream: ${upstream_head}" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin "HEAD:refs/heads/${TEST_BRANCH}" \
            "--force-with-lease=refs/heads/${TEST_BRANCH}:${old_head}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          {
            echo "### XPU kernel nightly branch updated"
            echo "- Branch: \`${TEST_BRANCH}\`"
            echo "- Upstream: \`${upstream_head}\`"
            echo "- Test commit: \`$(git rev-parse HEAD)\`"
            echo "- Latest kernel nightly wheel is selected when Intel CI builds."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger full Intel CI
        env:
          BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_TOKEN }}
          TEST_COMMIT: ${{ steps.update.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          validation_date="$(TZ=Asia/Shanghai date +%Y.%m.%d)"
          payload="$(jq -n \
            --arg commit "$TEST_COMMIT" \
            --arg branch "wendyliu235:${TEST_BRANCH}" \
            --arg message "Nightly-kernel whl validation ${validation_date}

          PR #66995" \
            '{
              commit: $commit,
              branch: $branch,
              message: $message,
              pull_request_id: 66995,
              pull_request_base_branch: "main",
              pull_request_repository: "https://github.com/wendyliu235/vllm-public.git",
              pull_request_labels: ["ci/build", "intel-gpu"],
              ignore_pipeline_branch_filters: true,
              env: {
                NIGHTLY: "1",
                RUN_ALL: "1",
                VLLM_XPU_KERNEL_NIGHTLY: "1"
              }
            }')"
          response="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 30 --max-time 120 \
            --request POST \
            --header "Authorization: Bearer ${BUILDKITE_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            https://api.buildkite.com/v2/organizations/vllm/pipelines/intel-ci/builds)"
          build_url="$(jq -er '.web_url | strings | select(length > 0)' <<< "$response")"
          echo "Full Intel CI: $build_url"
          {
            echo "### Kernel nightly full Intel CI"
            echo "[Build](${build_url})"
            echo "Commit: \`${TEST_COMMIT}\`"
            echo "PR #66995; NIGHTLY=1, RUN_ALL=1, VLLM_XPU_KERNEL_NIGHTLY=1"
          } >> "$GITHUB_STEP_SUMMARY"
